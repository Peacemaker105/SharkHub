<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shark Hub layer renderer v2</title>
<style>
  html, body { margin: 0; background: #0b1118; color: #9fd; font: 13px/1.4 monospace; }
  #hud { position: fixed; left: 12px; top: 10px; white-space: pre; pointer-events: none; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { HDRCubeTextureLoader } from 'three/addons/loaders/HDRCubeTextureLoader.js';

// ============================================================================================
// v2 layer renderer: a multi-part car GLB (parts named, materials named, wheel hubs known) is
// rendered from ONE fixed camera into transparent layers the app composes:
//   body           white ghost shell + crease lines (app tints it)
//   body_solid     the painted shell, per time of day (lamps lit at night)
//   drive          the rolling chassis (separate GLB), greyed later by pack_v2.py
//   wheel_XX_NN    each corner at NN spin phases; near-side wheels are cut by the body's depth
//   <time>_bg      the modelled highway + procedural sky for dawn / day / dusk / night
//   view_*         side / front / rear elevations for the inclinometer
// plus <tag>_meta.json (v1 schema + times / views / paint / files). Everything model-specific
// comes from the rig JSON (?rig=…): model URL, up axis, scale, hubs, part names, textures.
// URL: ?rig=file.json&paint=hex&w=2400&h=1750&fov=32&edge=45&time=day&auto=1&times=a,b&wheelTimes=night
// Console: renderAll(opts), preview(az,el,dist,spin), setTime(name), setPaint(hex), solid(bool), debug(mode)
// ============================================================================================
const params = new URLSearchParams(location.search);
const hud = document.getElementById('hud');
const say = (t) => { hud.textContent = t; console.log(t); };
const rig = await (await fetch(params.get('rig') || 'rig.json')).json();
const W = parseInt(params.get('w') || (rig.canvas && rig.canvas[0]) || '2400', 10);
const H = parseInt(params.get('h') || (rig.canvas && rig.canvas[1]) || '1750', 10);
const TAG = params.get('tag') || rig.tag || 'v2';
const MPU = rig.metresPerUnit || 2.88;          // metres per world unit — v1's convention (1 unit = 2.88 m) so the meta stays compatible
const UPM = 1 / MPU;                             // world units per metre
const S = (rig.toMetres || 1) / MPU;             // model units → world units
const VIEW = Object.assign({ az: 235, el: 9, dist: 2.9, fov: 32 }, rig.view || {});
if (params.has('fov')) VIEW.fov = parseFloat(params.get('fov'));
const EDGE = parseFloat(params.get('edge') || rig.edge || '45');

// ---------------------------------------------------------------- renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;   // blurred (soft) shadows: sun.shadow.radius / blurSamples below
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(VIEW.fov, W / H, 0.01, 4000);
const pmrem = new THREE.PMREMGenerator(renderer);

// ---------------------------------------------------------------- small helpers
const dirFrom = (az, el) => { const a = az * Math.PI / 180, e = el * Math.PI / 180; return new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)); };
function mulberry32(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function valueNoise1D(seed, n) { const r = mulberry32(seed); const g = Array.from({ length: n + 1 }, () => r()); return (x) => { const i = Math.floor(x) % n, f = x - Math.floor(x), t = f * f * (3 - 2 * f); return g[i] * (1 - t) + g[(i + 1) % (n + 1)] * t; }; }
function fbm1D(seed, x, octaves = 5) { let a = 0, amp = 0.5, fr = 1, sum = 0; for (let o = 0; o < octaves; o++) { const nz = valueNoise1D(seed + o * 101, 64); a += amp * nz(x * fr); sum += amp; amp *= 0.5; fr *= 2.1; } return a / sum; }
const noiseCache = {};
function noise2(seed, x, y) { const key = seed; if (!noiseCache[key]) { const r = mulberry32(seed); noiseCache[key] = Array.from({ length: 64 * 64 }, () => r()); } const g = noiseCache[key]; const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf); const at = (i, j) => g[((j & 63) * 64) + (i & 63)]; return (at(xi, yi) * (1 - sx) + at(xi + 1, yi) * sx) * (1 - sy) + (at(xi, yi + 1) * (1 - sx) + at(xi + 1, yi + 1) * sx) * sy; }
function fbm2(seed, x, y, o = 4) { let a = 0, amp = 0.5, f = 1, s = 0; for (let i = 0; i < o; i++) { a += amp * noise2(seed + i * 7, x * f, y * f); s += amp; amp *= 0.5; f *= 2; } return a / s; }
const hex = (c) => '#' + new THREE.Color(c).getHexString();
const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);

// ---------------------------------------------------------------- textures (all optional; a missing file just means "unmapped")
const T = rig.textures || {};
const texBase = T.base || '';
const loader = new THREE.TextureLoader();
async function loadTex(file, { srgb = false, flipY = true, repeat = 0, wrap = false } = {}) {
  if (!file) return null;
  const t = await new Promise((res) => loader.load(file.startsWith('/') || file.startsWith('http') ? file : texBase + file, res, undefined, () => res(null)));
  if (!t) { console.warn('texture missing:', file); return null; }
  t.flipY = flipY; t.anisotropy = 8; t.needsUpdate = true;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat || wrap) { t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(repeat, repeat); }
  return t;
}
const texFlip = T.flipY !== false;               // the decoded atlases' row order vs the model's UV origin — set in the rig once checked by eye
const tyreMap = await loadTex(T.tyreMap, { srgb: true, flipY: T.tyreFlipY == null ? texFlip : T.tyreFlipY });
const tyreNormal = T.tyreNormal ? await loadTex(T.tyreNormal, { flipY: T.tyreFlipY == null ? texFlip : T.tyreFlipY }) : null;
const aoPaint = await loadTex(T.ao && T.ao.paint, { flipY: texFlip });
const aoPlastic = await loadTex(T.ao && T.ao.plastic, { flipY: texFlip });
const aoTub = await loadTex(T.ao && T.ao.tub, { flipY: texFlip });
for (const t of [aoPaint, aoPlastic, aoTub]) if (t) t.channel = 0;   // this model has one UV set: AO reads the same 'uv' as the colour map
function proceduralFlakeNormal(size = 64, repeat = 40, strength = 0.35) {
  // metallic flake: random near-vertical normals, tiled finely under the clearcoat
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const img = g.createImageData(size, size); const r = mulberry32(7);
  for (let i = 0; i < size * size; i++) {
    let x = (r() * 2 - 1) * strength, y = (r() * 2 - 1) * strength, z = 1; const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
    img.data[i * 4] = (x * 0.5 + 0.5) * 255; img.data[i * 4 + 1] = (y * 0.5 + 0.5) * 255; img.data[i * 4 + 2] = (z * 0.5 + 0.5) * 255; img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8; return t;
}
const flake = (T.flakeNormal && await loadTex(T.flakeNormal, { repeat: T.flakeRepeat || 40 })) || proceduralFlakeNormal(64, T.flakeRepeat || 40);

// ---------------------------------------------------------------- materials (BYD's own material names on every primitive)
const DS = THREE.DoubleSide;   // liners and floors are single-sided toward the cabin: cull nothing on the car
const paintMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0.3, roughness: 0.42, clearcoat: 1.0, clearcoatRoughness: 0.06, side: DS,
  normalMap: flake, normalScale: new THREE.Vector2(0.15, 0.15), aoMap: aoPaint, aoMapIntensity: aoPaint ? 1.0 : 0, envMapIntensity: 1.0 });
window.setPaint = (h) => { if (h) paintMat.color.set('#' + String(h).replace('#', '')); else if (rig.paint && rig.paint.linear) paintMat.color.setRGB(...rig.paint.linear); else paintMat.color.set(0x1f5fa8); return hex(paintMat.color); };
window.setPaint(params.get('paint') || (rig.paint && rig.paint.hex));
// Tintable paint: the app colours the panels itself, so they are rendered twice more — a diffuse-only
// pass on a flat neutral grey (the app multiplies it by chosen ÷ PAINT_NEUTRAL per channel) and the
// clearcoat / reflection term on its own (black base, added back untinted). The grey sits at linear
// ≈ 0.5 so sunlit panels keep their gradient instead of clipping before the app scales them up.
const PAINT_NEUTRAL = 0xbcbcbc;
const paintBaseMat = new THREE.MeshStandardMaterial({ color: PAINT_NEUTRAL, metalness: 0, roughness: 1.0, side: DS, aoMap: aoPaint, aoMapIntensity: aoPaint ? 1.0 : 0, envMapIntensity: 1.0 });
const paintSpecMat = new THREE.MeshPhysicalMaterial({ color: 0x000000, metalness: 0.3, roughness: 0.42, clearcoat: 1.0, clearcoatRoughness: 0.06, side: DS,
  normalMap: flake, normalScale: new THREE.Vector2(0.15, 0.15), envMapIntensity: 1.0 });
const chromeMat =new THREE.MeshStandardMaterial({ color: 0xd9dcdf, metalness: 1.0, roughness: 0.28, side: DS });   // satin: mirror chrome turns into white blobs under an empty sky
const alloyMat = new THREE.MeshStandardMaterial({ color: 0xc4c8cc, metalness: 0.95, roughness: 0.3, side: DS });
const skidMat = new THREE.MeshStandardMaterial({ color: 0xb9bcc0, metalness: 0.75, roughness: 0.5, side: DS });     // the bumper skid is silver plastic, not mirror chrome
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0c1014, metalness: 0.0, roughness: 0.04, transparent: true, opacity: 0.6, side: DS, depthWrite: false, envMapIntensity: 1.3 });
const lampCoverMat = new THREE.MeshPhysicalMaterial({ color: 0x9aa4ac, metalness: 0.0, roughness: 0.03, transparent: true, opacity: 0.28, side: DS, depthWrite: false, envMapIntensity: 1.3 });   // headlamp covers are clear
const fritMat = new THREE.MeshStandardMaterial({ color: 0x0b0c0e, roughness: 0.35, metalness: 0.1, side: DS });
const tyreMat = new THREE.MeshStandardMaterial({ color: tyreMap ? 0xffffff : 0x151515, map: tyreMap, roughness: 0.88, metalness: 0.0, side: DS, normalMap: tyreNormal, normalScale: new THREE.Vector2(0.7, 0.7) });
const caliperMat = new THREE.MeshStandardMaterial({ color: tyreMap ? 0xffffff : 0x3a3a3c, map: tyreMap, roughness: 0.6, metalness: 0.2, side: DS });
const plasticAoMat = new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.62, metalness: 0.05, side: DS, aoMap: aoPlastic, aoMapIntensity: aoPlastic ? 1.0 : 0 });
const tubMat = new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.7, metalness: 0.05, side: DS, aoMap: aoTub, aoMapIntensity: aoTub ? 1.0 : 0 });
const plasticMat = new THREE.MeshStandardMaterial({ color: 0x141517, roughness: 0.3, metalness: 0.15, side: DS });
const fabricMat = new THREE.MeshStandardMaterial({ color: 0x1e1f23, roughness: 0.92, side: DS });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, side: DS });
const underMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0c, roughness: 0.95, side: DS });
const ghostMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.05, transparent: true, opacity: 0.14, depthWrite: false, side: THREE.FrontSide });   // thin fill: the chassis is the subject of the x-ray
const edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.62 });
const depthOnly = new THREE.MeshBasicMaterial({ colorWrite: false, side: DS });                       // cuts the near wheels behind the arches
const shadowOnly = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false, side: DS });   // casts the truck's shadow into the bg plate
const lampGlass = (color, opacity) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.05, metalness: 0, transparent: true, opacity, side: DS, depthWrite: false, clearcoat: 1 });
const lampLit = (color, emissive, ei) => new THREE.MeshPhysicalMaterial({ color, emissive, emissiveIntensity: ei, roughness: 0.15, metalness: 0, side: DS, clearcoat: 1 });

// ---------------------------------------------------------------- the car
const gltf = await new Promise((res, rej) => new GLTFLoader().load(rig.model, res, undefined, rej));
const model = gltf.scene;
const root = new THREE.Group();
if (rig.up === 'z') root.rotation.x = -Math.PI / 2; else if (rig.up === 'x') root.rotation.z = Math.PI / 2; else if (rig.up === '-x') root.rotation.z = -Math.PI / 2;
root.scale.setScalar(S);
root.add(model);
scene.add(root);
const nameOf = (o) => (o.userData && o.userData.node) || (o.parent && o.parent.userData && o.parent.userData.node) || o.name || (o.parent && o.parent.name) || '';
const stateOf = (o) => ((o.userData && o.userData.state) || (o.parent && o.parent.userData && o.parent.userData.state) || '').toLowerCase();
const startsAny = (n, list) => (list || []).some((p) => n.startsWith(p));
const includesAny = (n, list) => (list || []).some((p) => n.includes(p));
const allNames = (o) => [o.name, o.userData && o.userData.node, o.parent && o.parent.name, o.parent && o.parent.userData && o.parent.userData.node].filter(Boolean);
const drop = []; model.traverse((o) => {
  if (!o.isMesh) return;
  const mat = ((o.material && o.material.name) || '').toLowerCase();
  if (allNames(o).some((n) => startsAny(n, rig.hide)) || mat.startsWith('lightbeam')) drop.push(o);
});
drop.forEach((o) => o.parent.remove(o));
console.log('dropped', drop.map((o) => o.name).join(', '));
model.updateMatrixWorld(true);

// wheels: spinning parts re-parented under steer→spin pivots at the hub (model frame), calipers fixed beside them
const wheelNames = ['FL', 'FR', 'RL', 'RR'];
const wheels = {};            // n → { layer, steer, spin, hub(model Vector3), meshes: [] }
const bodyMeshes = [], edgeLines = [], lamps = [];
const bodyGroup = new THREE.Group(); bodyGroup.name = 'body';
for (const n of wheelNames) {
  const spec = rig.wheels[n];
  const hub = new THREE.Vector3(...spec.hub);
  const layer = new THREE.Group(); layer.name = 'wheel_' + n;
  const steer = new THREE.Group(); steer.position.copy(hub); layer.add(steer);
  const spin = new THREE.Group(); steer.add(spin);
  const fixed = new THREE.Group(); fixed.position.copy(hub); layer.add(fixed);
  wheels[n] = { layer, steer, spin, fixed, hub, meshes: [], spec };
  model.add(layer);
}
for (const child of model.children.slice()) {
  if (child.name.startsWith('wheel_') && wheelNames.some((n) => child === wheels[n].layer)) continue;
  const meshes = []; child.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const names = allNames(child).concat(meshes.flatMap(allNames));
  const nm = child.name || nameOf(child);
  let owner = null;
  for (const n of wheelNames) { const p = wheels[n].spec.part; if (names.some((x) => x === p || x.startsWith(p + '_'))) owner = n; }
  if (owner) {
    const w = wheels[owner];
    // BYD's extras.node can carry a "_1"/"_2" suffix (e.g. wheel_01_RF_kq_1), so match the suffix loosely
    const fixedRe = rig.fixedWheelSuffix ? new RegExp(rig.fixedWheelSuffix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(_\\d+)?$') : null;
    const isFixed = !!(fixedRe && names.some((x) => fixedRe.test(x)));
    (isFixed ? w.fixed : w.spin).add(child);
    child.position.sub(w.hub);
    meshes.forEach((m) => { w.meshes.push(m); m.userData.part = nm; m.userData.fixed = isFixed; });
  } else {
    bodyGroup.add(child);
    meshes.forEach((m) => { bodyMeshes.push(m); m.userData.part = nm; });
  }
}
model.add(bodyGroup);
// optional flat underbody plates (model frame) to stop see-through where BYD's floor is single-sided or missing
for (const u of rig.underbody || []) {
  const g = new THREE.PlaneGeometry(u.x1 - u.x0, u.y1 - u.y0);
  const m = new THREE.Mesh(g, underMat); m.position.set((u.x0 + u.x1) / 2, (u.y0 + u.y1) / 2, u.z); m.userData.part = 'underbody'; m.userData.ghostHide = true;
  bodyGroup.add(m); bodyMeshes.push(m);
}

// materials by BYD material name (+ node state for the lamps), lamp lit/unlit pairs kept per mesh
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(255,255,255,0.75)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const glows = new THREE.Group(); glows.name = 'glows'; bodyGroup.add(glows);
function addGlow(mesh, color, size, opacity, kind) {
  const bb = new THREE.Box3().setFromObject(mesh); const c = bb.getCenter(new THREE.Vector3());
  bodyGroup.worldToLocal(c);
  // depth-tested and pushed 12 cm outward from the lens (−X at the nose, +X at the tail, and up for a
  // roof-mounted lamp), so the halo sits just in front of its lens and bodywork occludes it — no glow
  // through the cab or over the roof rails
  c.x += (c.x < 0 ? -0.12 : 0.12); if (c.z > 1.45) c.z += 0.06;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity, depthTest: true, depthWrite: false, fog: false }));
  s.position.copy(c); s.scale.set(size, size, 1); s.renderOrder = 20; s.userData.kind = kind; s.userData.baseOpacity = opacity; s.visible = false; glows.add(s); return s;
}
function lampFor(o) {
  const st = stateOf(o), nm = nameOf(o);
  const bb = new THREE.Box3().setFromObject(o); const c = bb.getCenter(new THREE.Vector3()); model.worldToLocal(c);
  const front = c.x < 0;   // nose at −X in this model
  if (st.includes('lightposition') || st.includes('lamps_n20') || st.includes('lamps_n26')) {
    const brake = st.includes('lamps_n2');
    return { kind: brake ? 'brake' : 'tail', side: c.y < 0 ? 'L' : 'R', unlit: lampGlass(0x4a0806, 0.92), lit: lampLit(0xff2418, 0xff1a0c, brake ? 1.4 : 3.0), glow: brake ? null : [0xff3020, 0.45, 0.6] };
  }
  if (st.includes('lightday')) return { kind: 'drl', side: c.y < 0 ? 'L' : 'R', unlit: new THREE.MeshStandardMaterial({ color: 0xdfe4ea, roughness: 0.4, side: DS }), lit: lampLit(0xffffff, 0xf0f6ff, 5.0), glow: [0xeaf3ff, 0.35, 0.55] };
  if (st.includes('lightturn')) return { kind: 'turn', side: c.y < 0 ? 'L' : 'R', unlit: lampGlass(0xc8a060, 0.8), lit: lampLit(0xffb030, 0xffa020, 5.0), glow: [0xffb040, 0.4, 0.6] };
  if (st.includes('lightwhite') && front) return { kind: 'head', side: c.y < 0 ? 'L' : 'R', unlit: new THREE.MeshStandardMaterial({ color: 0x9aa0a8, metalness: 0.9, roughness: 0.25, side: DS }), lit: lampLit(0xffffff, 0xfff4e4, 7.0), glow: [0xfff2dc, 0.6, 0.7] };
  if (st.includes('lightwhite')) return { kind: c.x > 2.4 ? 'reverse' : 'bed', side: c.y < 0 ? 'L' : 'R', unlit: lampGlass(0xd8dde2, 0.7), lit: lampLit(0xffffff, 0xfff6ea, 5.0), glow: [0xfff6ea, 0.3, 0.5] };
  if (st.includes('lightfog')) return { kind: 'fog', side: c.y < 0 ? 'L' : 'R', front, unlit: lampGlass(front ? 0xd0d4da : 0x6a0a08, 0.75), lit: lampLit(front ? 0xfff6e0 : 0xff2418, front ? 0xffefd0 : 0xff1a0c, 4.0), glow: [front ? 0xfff0d0 : 0xff3020, 0.35, 0.5] };
  return { kind: 'lens', unlit: lampGlass(0x1a1e24, 0.5), lit: null, glow: null };
}
function materialFor(o) {
  const m = ((o.material && o.material.name) || '').toLowerCase(); const nm = nameOf(o); const st = stateOf(o);
  // a Kanzi lamp state manager on the node wins over the material name (BYD tags projector lenses plasticBlack_ao, DRL strips chrome)
  if (m === 'glasslight' || (st && !st.includes('glassline'))) {
    const L = lampFor(o); o.userData.lamp = L;
    if (L.glow) L.sprites = [addGlow(o, L.glow[0], L.glow[1] * 0.8, L.glow[2], L.kind), addGlow(o, L.glow[0], L.glow[1] * 1.5, L.glow[2] * 0.18, L.kind)];
    lamps.push(o);
    return L.unlit;
  }
  if (m === 'paint') return paintMat;
  if (m === 'chrome') return nm.toLowerCase().includes('jinshu') ? alloyMat : includesAny(nm, rig.skidParts) ? skidMat : chromeMat;
  if (m === 'window') return includesAny(nm, rig.lampCoverParts) ? lampCoverMat : glassMat;
  if (m === 'glasslinemeterial') return fritMat;
  if (m === 'tirepa') return o.userData.fixed ? caliperMat : tyreMat;
  if (m === 'plasticblack_ao') return includesAny(nm, rig.tubParts) ? tubMat : plasticAoMat;
  if (m === 'plasticblack') return plasticMat;
  if (m.startsWith('interior')) return fabricMat;
  if (m === 'texturedmaterial') return whiteMat;
  return plasticAoMat;
}
for (const o of bodyMeshes.concat(...wheelNames.map((n) => wheels[n].meshes))) {
  if (o.userData.part === 'underbody') { o.userData.solid = underMat; continue; }
  o.userData.solid = materialFor(o);
  o.material = o.userData.solid;
  o.castShadow = true; o.receiveShadow = true;
  if (bodyMeshes.includes(o) && (startsAny(o.userData.part, rig.ghostHide) || ((o.material.name || '').toLowerCase().startsWith('interior')))) o.userData.ghostHide = true;
  if (bodyMeshes.includes(o)) {
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, EDGE), edgeMat); e.visible = false; o.add(e); edgeLines.push(e);
  }
}
let lampsLit = 'day';   // 'off' | 'day' (DRL only) | 'low' (DRL + heads + tails) | 'night' (+ glow sprites)
function setLamps(mode) {
  lampsLit = mode;

// window and the door trim had written their depth — and showed through the glass). A depth
// pre-pass of every opaque part first, then the layer's own pass on top of that depth (LessEqual),
// settles it: a fragment only lands if nothing opaque is nearer. Clear parts (glass, lamp covers)
// stay out of the pre-pass, so the interior is still seen through the windows.
async function captureShell(name, mode) {
  setBodyMode('depth');
  const clear = bodyMeshes.filter((o) => o.userData.solid && o.userData.solid.transparent);
  for (const o of clear) o.visible = false;
  renderer.autoClear = true; renderer.clear(); renderer.render(scene, camera);
  setBodyMode(mode);   // restores visibility too
  renderer.autoClear = false; renderer.render(scene, camera); renderer.autoClear = true;
  return capture(name, false, false);
}
// quick look: the current frame (over a dark background) scaled down and saved as JPEG — for iterating on lighting without screenshots
window.snap = async (name = 'snap', scale = 0.5, bg = '#0b1118') => {
  const c = document.createElement('canvas'); c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  const g2 = c.getContext('2d'); g2.fillStyle = bg; g2.fillRect(0, 0, c.width, c.height); g2.drawImage(renderer.domElement, 0, 0, c.width, c.height);
  const r = await fetch('/save?name=' + encodeURIComponent(name + '.jpg'), { method: 'POST', body: c.toDataURL('image/jpeg', 0.9) });
  return await r.text();
};

// ---------------------------------------------------------------- inclinometer elevations
const VIEWS = Object.assign({
  side:  { az: 180, el: 0, fov: 9, fill: 0.9, sunAz: 150 },     // nose to the right, driver's side
  front: { az: 270, el: 2.5, fov: 9, fill: 0.6, sunAz: 245 },   // fill by width; the height must also clear the canvas (checked below)
  rear:  { az: 90, el: 2.5, fov: 9, fill: 0.6, sunAz: 70 },
}, rig.views || {});
function frameView(v) {
  camera.fov = v.fov; camera.updateProjectionMatrix();
  const size = box3.getSize(new THREE.Vector3());
  const extent = (v.az % 180 === 0) ? size.x : size.z;
  const fovH = 2 * Math.atan(Math.tan(v.fov * Math.PI / 360) * W / H);
  let d = (extent / 2 / v.fill) / Math.tan(fovH / 2);
  // never let the tyres fall off the bottom edge: the truck's height must fit 88 % of the frame too
  d = Math.max(d, (size.y / 2 / 0.88) / Math.tan(v.fov * Math.PI / 360));
  camera.position.copy(centre).addScaledVector(dirFrom(v.az, v.el), d);
  camera.lookAt(centre); camera.updateMatrixWorld(true);
}
async function renderViews(meta, time = 'day') {
  const saved = { az, el, dist };
  await applyTime(time);
  meta.views = {};
  for (const [name, v] of Object.entries(VIEWS)) {
    const t = TIMES[time];
    const dir = dirFrom(v.sunAz == null ? v.az - 30 : v.sunAz, v.sunEl == null ? 42 : v.sunEl);
    sun.position.copy(dir).multiplyScalar(40);
    frameView(v);
    show('body'); setWheelMode('solid'); setSpin(0); setLamps('off');
    const crop = await captureShell(`${TAG}_view_${name}`, 'rest');
    const baseCrop = await captureShell(`${TAG}_view_${name}_paint_base`, 'paintBase');
    const specCrop = await captureShell(`${TAG}_view_${name}_paint_spec`, 'paintSpec');
    setBodyMode('solid'); setLamps(t.lamps || 'day');
    const side = name === 'side';
    const zNear = v.az === 180 ? -tr : v.az === 0 ? tr : 0;
    meta.views[name] = {
      canvasCrop: crop, paintBaseCrop: baseCrop, paintSpecCrop: specCrop, view: { az: v.az, el: v.el, fov: v.fov },
      ground: project(side ? midX : (name === 'front' ? fx : rx), g, side ? -tr : -tr)[1],
      pivot: project(side ? midX : (name === 'front' ? fx : rx), g, 0),
      hubs: side ? { front: project(fx, ay, -tr), rear: project(rx, ay, -tr) } : { left: project(name === 'front' ? fx : rx, ay, tr), right: project(name === 'front' ? fx : rx, ay, -tr) },
      pxPerM: side ? Math.abs(project(fx, g, -tr)[0] - project(rx, g, -tr)[0]) / (wb * MPU) : Math.abs(project(fx, g, tr)[0] - project(fx, g, -tr)[0]) / (2 * tr * MPU),
    };
  }
  frame(saved.az, saved.el, saved.dist);
  await applyTime(time);
}

// ---------------------------------------------------------------- the job
window.renderAll = async (opts = {}) => {
  const times = opts.times || (params.get('times') || 'day,dawn,dusk,night').split(',').filter(Boolean);
  const wheelTimes = opts.wheelTimes || (params.get('wheelTimes') || 'night').split(',').filter(Boolean);
  const phases = opts.phases || parseInt(params.get('phases') || '12', 10);
  const base = opts.base || 'day';
  const doViews = opts.views !== false && params.get('views') !== '0';
  const t0 = performance.now();
  frame(VIEW.az, VIEW.el, VIEW.dist);
  await applyTime(base);
  const meta = { tag: TAG, canvas: [W, H], view: { az: VIEW.az, el: VIEW.el, dist: VIEW.dist, fov: camera.fov }, phases, layers: {}, wheels: {}, anchors: {} };
  meta.metresPerUnit = MPU;
  meta.model = { name: rig.name || rig.model.split('/').pop(), up: rig.up, toMetres: rig.toMetres, unitScale: S, bbox: { min: box3.min.toArray(), max: box3.max.toArray() } };
  // hex = the preview colour only; the app tints paintBase by its own choice ÷ neutral
  meta.paint = { hex: hex(paintMat.color), name: (params.get('paint') ? 'custom' : (rig.paint && rig.paint.name) || 'default'), tintable: true, neutral: hex(PAINT_NEUTRAL) };
  meta.camera = { position: camera.position.toArray(), target: centre.toArray(), fov: camera.fov, aspect: W / H };
  meta.files = { body: `${TAG}_body.png`, bodySolid: `${TAG}_body_solid.png`, paintBase: `${TAG}_paint_base.png`, paintSpec: `${TAG}_paint_spec.png`, drive: `${TAG}_drive.png`, bg: null, wheels: {} };
  meta.times = {};
  setSpin(0); setSteer(0);
  // The shell as three layers with every lamp unlit (lamps only ever come from their overlays, driven
  // by the car): bodySolid = chrome / glass / plastics / lenses with the paint panels as depth-only
  // holes, paintBase = the panels diffuse-only on the neutral grey, paintSpec = their clearcoat alone.
  const shellLayers = async (prefix) => {
    show('body'); setWheelMode('shadow'); setLamps('off');
    const out = {};
    out.bodySolid = await captureShell(`${prefix}_body_solid`, 'rest');
    out.paintBase = await captureShell(`${prefix}_paint_base`, 'paintBase');
    out.paintSpec = await captureShell(`${prefix}_paint_spec`, 'paintSpec');
    setBodyMode('solid'); setLamps(TIMES[currentTime].lamps || 'day');
    return out;
  };
  // neutral layers under the base (day) light
  show('body'); setBodyMode('ghost'); setWheelMode('shadow'); meta.layers.body = await capture(`${TAG}_body`);
  Object.assign(meta.layers, await shellLayers(TAG));
  show('drive'); meta.layers.drive = await capture(`${TAG}_drive`);
  const doWheels = async (prefix) => {
    const out = {};
    for (const n of wheelNames) {
      show('wheel_' + n); setWheelMode('solid');
      setBodyMode(nearSide(n) ? 'depth' : 'shadow');   // near wheels are cut by the arches so the painted shell composes over them
      bodyGroup.visible = true;
      out[n] = [];
      for (let p = 0; p < phases; p++) { setSpin(p / phases * 2 * Math.PI); out[n].push(await capture(`${prefix}_wheel_${n}_${String(p).padStart(2, '0')}`)); }
    }
    setSpin(0); setBodyMode('solid');
    return out;
  };
  const baseFrames = await doWheels(TAG);
  for (const n of wheelNames) {
    const wm = wheels[n];
    meta.wheels[n] = { hub: project(hubW[n].x, hubW[n].y, hubW[n].z), frames: baseFrames[n], near: nearSide(n),
      pivotModel: wm.hub.toArray(), pivotWorld: hubW[n].toArray(), spinAxis: 'model +Y (three -Z); positive roll = forward', steerAxis: 'model +Z (three +Y)' };
    meta.files.wheels[n] = baseFrames[n].map((_, p) => `${TAG}_wheel_${n}_${String(p).padStart(2, '0')}.png`);
  }
  // scene geometry + anchors: the driveline callouts come from the aligned chassis itself, the rest from the v1 formulas
  meta.groundH = groundHomography();
  meta.road = Object.assign({ unitsPerM: UPM, ground: g }, ROAD, { centreLine: SCN.centreLine, dashes: SCN.centreLine === 'dashed', railZ: SCN.rail === false ? null : SCN.railZ });
  meta.contactShadow = TIMES[base].contactShadow !== false;
  const ca = chassisAnchors();
  meta.anchors = {
    battery: ca ? project(...ca.battery) : project(midX + 0.02, ay - 0.02, 0), engine: ca ? project(...ca.engine) : project(fx - 0.09, ay + 0.12, 0),
    frontMotor: ca ? project(...ca.frontMotor) : project(fx + 0.12, ay + 0.06, 0), rearMotor: ca ? project(...ca.rearMotor) : project(rx - 0.02, ay + 0.03, 0),
    nose: project(box3.min.x, ay + 0.1, 0), tail: project(box3.max.x, ay + 0.1, 0),
    roof: project(centre.x, box3.max.y, 0),
    groundFront: project(fx, g, -tr), groundRear: project(rx, g, -tr), groundFrontFar: project(fx, g, tr), groundRearFar: project(rx, g, tr),
    pivot: project(midX, g, 0),
  };
  meta.unitsPerPx = (box3.max.x - box3.min.x) / Math.abs(meta.anchors.nose[0] - meta.anchors.tail[0]);
  // per time of day: bg plate (truck as a shadow caster only) + painted shell (+ wheels where asked)
  for (const tn of times) {
    await applyTime(tn);
    const t = TIMES[tn];
    show('bg'); setBodyMode('shadow'); setWheelMode('shadow');
    const bgCrop = await capture(`${TAG}_${tn}_bg`, true);
    if (!meta.layers.bg) { meta.layers.bg = bgCrop; }
    setWideFov(true); await capture(`${TAG}_${tn}_bg_wide`, true); setWideFov(false);
    const named = (n) => tn === base ? `${TAG}_${n}.png` : `${TAG}_${tn}_${n}.png`;
    const entry = { bg: `${TAG}_${tn}_bg.png`, bgWide: { file: `${TAG}_${tn}_bg_wide.png`, scale: 2, centre: [W / 2, H / 2] },
      bodySolid: named('body_solid'), paintBase: named('paint_base'), paintSpec: named('paint_spec'), wheels: null, grade: t.grade,
      sun: { az: t.sun.az, el: t.sun.el, color: hex(t.sun.color) }, fog: hex(t.fog.color), lamps: 'off', plateLamps: t.lamps, exposure: t.exposure };
    if (tn !== base) { const c = await shellLayers(`${TAG}_${tn}`); entry.bodySolidCrop = c.bodySolid; entry.paintBaseCrop = c.paintBase; entry.paintSpecCrop = c.paintSpec; }
    if (tn !== base && wheelTimes.includes(tn)) {
      const fr = await doWheels(`${TAG}_${tn}`);
      entry.wheels = {}; for (const n of wheelNames) entry.wheels[n] = { frames: fr[n], files: fr[n].map((_, p) => `${TAG}_${tn}_wheel_${n}_${String(p).padStart(2, '0')}.png`) };
    }
    meta.times[tn] = entry;
    if (tn === base) meta.files.bg = entry.bg;
  }
  meta.defaultTime = base;
  if (doViews) await renderViews(meta, base);
  await applyTime(base);
  await saveJson(`${TAG}_meta.json`, meta);
  show('all'); setBodyMode('solid'); setWheelMode('solid');
  renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0);
  const secs = ((performance.now() - t0) / 1000).toFixed(0);
  say(`done ${TAG} in ${secs}s — times ${times.join(',')} wheels@${wheelTimes.join(',')}`);
  if (params.get('auto') !== '1') await saveJson(`${TAG}_done.json`, { tag: TAG, seconds: +secs, times, wheelTimes, paint: meta.paint });
  return meta;
};
// preview = the finished look (painted truck on the scene, no driveline); previewXray = the ghost + chassis check
// ---------------------------------------------------------------- extras: lit-lamp overlays + motion-blurred road plates
// Lit lamps: one transparent layer per lamp group (same camera, cropped), rendered at night with the
// body and wheels as depth-only occluders (clear covers hidden so they don't occlude their own
// projectors) — the app composites them additively from real car states.
const LIGHT_GROUPS = {
  head:    (L) => L.kind === 'head',
  drl:     (L) => L.kind === 'drl',    // its own layer: the strips are on by day too, when the low beams aren't
  tail:    (L) => L.kind === 'tail',
  brake:   (L) => L.kind === 'brake' || L.kind === 'tail',   // the tagged brake pieces are slivers inside the cluster: braking = the whole rear cluster, brighter
  turn_L:  (L) => L.kind === 'turn' && L.side === 'L',
  turn_R:  (L) => L.kind === 'turn' && L.side === 'R',
  fog:     (L) => L.kind === 'fog',
  reverse: (L) => L.kind === 'reverse',
};
// This model carries no lightTurn state: the Shark's front indicators ARE its DRL strips (sequential
// amber), so `turn_*` falls back to those strips lit amber when no lightTurn node exists.
const turnFallback = { turn_L: (L) => L.kind === 'drl' && L.side === 'L', turn_R: (L) => L.kind === 'drl' && L.side === 'R' };
const amberLit = lampLit(0xffb030, 0xffa020, 6.0);
const brakeLit = lampLit(0xff2418, 0xff1a0c, 6.0);
/** 0..1: how squarely a halo's lens faces the camera (lenses face out along the truck's axis: nose −X, tail +X). */
function facing(s) {
  const p = s.getWorldPosition(new THREE.Vector3());
  const d = new THREE.Vector3(p.x < centre.x ? -1 : 1, 0, 0);
  return Math.max(0, d.dot(camera.position.clone().sub(p).normalize()));
}
async function renderLights(meta, time = 'night') {
  await applyTime(time);
  frame(VIEW.az, VIEW.el, VIEW.dist);
  meta.lights = {};
  const allSprites = glows.children;
  for (const [name, pick] of Object.entries(LIGHT_GROUPS)) {
    let members = lamps.filter((o) => o.userData.lamp.lit && pick(o.userData.lamp));
    let synthetic = false;
    if (!members.length && turnFallback[name]) { members = lamps.filter((o) => turnFallback[name](o.userData.lamp)); synthetic = true; }
    if (!members.length) continue;
    show('body'); setWheelMode('depth'); setBodyMode('depth');
    for (const o of bodyMeshes) if (o.userData.solid && o.userData.solid.transparent) o.visible = false;   // clear covers / glass never occlude
    allSprites.forEach((s) => { s.visible = false; });
    for (const o of members) {
      const L = o.userData.lamp;
      o.visible = true;
      o.material = name.startsWith('turn') && synthetic ? amberLit : name === 'brake' ? brakeLit : L.lit;
      if (L.sprites) L.sprites.forEach((s) => { s.visible = true; if (name.startsWith('turn') && synthetic) s.material.color.set(0xffb040); });
    }
    // a halo reads from the side its lens faces: scale it by the angle to the camera, so a tail lamp
    // seen from the front quarter (or the roof brake lamp from ahead) doesn't bloom through the cab
    for (const s of allSprites) if (s.visible) s.material.opacity = s.userData.baseOpacity * (0.08 + 0.92 * facing(s));
    const crop = await capture(`${TAG}_light_${name}`);
    for (const s of allSprites) s.material.opacity = s.userData.baseOpacity;
    for (const o of members) { const L = o.userData.lamp; if (L.sprites && name.startsWith('turn') && synthetic) L.sprites.forEach((s) => s.material.color.set(L.glow[0])); }
    if (crop) meta.lights[name] = Object.assign({ file: `${TAG}_light_${name}.png`, lamps: members.map((o) => nameOf(o)), synthetic }, crop);
    setBodyMode('solid'); setWheelMode('solid');
  }
  setLamps(TIMES[time].lamps);
  return meta.lights;
}
// Motion blur for the road band: the plate is re-rendered, then streaked away from the road's
// vanishing point below the horizon (6 px at the horizon → 24 px at the bottom edge). Done on the
// GPU from a canvas copy of the frame so colours round-trip exactly.
const blurQuad = (() => {
  const mat = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, vp: { value: new THREE.Vector2(0.8, 0.78) }, horizon: { value: 0.78 }, minLen: { value: 0.0025 }, maxLen: { value: 0.01 }, aspect: { value: W / H } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D tex; uniform vec2 vp; uniform float horizon, minLen, maxLen, aspect; varying vec2 vUv;
      void main() {
        vec4 c = texture2D(tex, vUv);
        if (vUv.y >= horizon) { gl_FragColor = c; }
        else {
          float t = clamp((horizon - vUv.y) / horizon, 0.0, 1.0);
          float len = mix(minLen, maxLen, t);
          vec2 d = vUv - vp; d.x *= aspect; d = normalize(d); d.x /= aspect;
          vec4 acc = vec4(0.0);
          for (int i = 0; i < 24; i++) { float f = float(i) / 23.0 - 0.5; vec2 p = vUv + d * len * f; p.y = min(p.y, horizon); acc += texture2D(tex, p); }
          gl_FragColor = acc / 24.0;
        }
        #include <colorspace_fragment>
      }`,
    depthTest: false, depthWrite: false, toneMapped: false,
  });
  const q = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat);
  const s = new THREE.Scene(); s.add(q);
  return { scene: s, camera: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), mat };
})();
async function renderBlurPlates(meta, times, { minPx = 6, maxPx = 24 } = {}) {
  meta.blur = { minPx, maxPx };
  for (const tn of times) {
    await applyTime(tn);
    show('bg'); setBodyMode('shadow'); setWheelMode('shadow');
    meta.times[tn] = meta.times[tn] || {};
    for (const wide of [false, true]) {   // the normal plate and its wide twin (see setWideFov)
      setWideFov(wide);
      renderer.render(scene, camera);
      wctx.clearRect(0, 0, W, H); wctx.drawImage(renderer.domElement, 0, 0);
      const tex = new THREE.CanvasTexture(work); tex.colorSpace = THREE.SRGBColorSpace; tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
      const vpPx = project(2000, g, 0), yh = horizonRow();   // the road recedes toward +X from this camera (the nose end is behind the camera's shoulder)
      const u = blurQuad.mat.uniforms;
      u.tex.value = tex; u.vp.value.set(vpPx[0] / W, 1 - vpPx[1] / H); u.horizon.value = 1 - yh / H; u.minLen.value = minPx / W; u.maxLen.value = maxPx / W; u.aspect.value = W / H;
      renderer.render(blurQuad.scene, blurQuad.camera);
      const name = `${TAG}_${tn}_bg_blur${wide ? '_wide' : ''}`;
      const crop = await capture(name, true, false);
      tex.dispose();
      meta.times[tn][wide ? 'bgBlurWide' : 'bgBlur'] = Object.assign({ file: name + '.png' }, crop, wide ? { scale: 2, centre: [W / 2, H / 2] } : {});
      if (!wide) { meta.blur.vanishingPoint = vpPx; meta.blur.horizonRow = yh; }
    }
    setWideFov(false);
  }
}
window.renderExtras = async (opts = {}) => {
  const times = opts.times || (params.get('times') || 'day,dawn,dusk,night').split(',').filter(Boolean);
  const meta = { tag: TAG, canvas: [W, H], times: {} };
  frame(VIEW.az, VIEW.el, VIEW.dist);
  if (opts.lights !== false) await renderLights(meta, 'night');
  if (opts.blur !== false) await renderBlurPlates(meta, times, opts);
  await applyTime('day');
  await saveJson(`${TAG}_extras.json`, meta);
  window.preview();
  say(`extras done: lights ${Object.keys(meta.lights || {}).join(',')} blur ${times.join(',')}`);
  return meta;
};
window.preview = (a = az, e = el, d = dist, spin = 0) => { frame(a, e, d); show('all'); drive.visible = false; setBodyMode('solid'); setWheelMode('solid'); setSpin(spin); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
window.previewXray = (a = az, e = el, d = dist) => { frame(a, e, d); show('all'); setBodyMode('ghost'); setWheelMode('solid'); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
window.previewView = (name) => { frameView(VIEWS[name]); show('body'); setBodyMode('solid'); setWheelMode('solid'); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
window.solid = (on) => { setBodyMode(on ? 'solid' : 'ghost'); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
window.setSpin = setSpin; window.setSteer = setSteer; window.TIMES = TIMES; window.VIEWS = VIEWS; window.scene = scene; window.THREE = THREE; window.rig = rig;
window.lights = { sun, hemi, headSpots, tailGlow, driveKey }; window.renderer = renderer; window.camera = camera;
window.chassisAnchors = chassisAnchors; window.envCubeCache = envCubeCache; window.project = project;
window.info = () => ({ hubs: hubW, wp, bbox: { min: box3.min.toArray(), max: box3.max.toArray() }, centre: centre.toArray(), radius, S, parts: bodyMeshes.length, lamps: lamps.map((o) => [nameOf(o), o.userData.lamp.kind]) });
// debug looks: 'ao' shows the AO atlases as colour, 'uv' the tyre map on everything, 'clay' flat grey
window.debug = (mode) => { debugMode = mode || null; setBodyMode('solid'); setWheelMode('solid'); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
// look at a world point from (az, el) at an absolute distance; render as-is (no mode changes)
window.look = (target, a, e, d) => { const t = new THREE.Vector3(...target); camera.position.copy(t).addScaledVector(dirFrom(a, e), d); camera.lookAt(t); camera.updateMatrixWorld(true); renderer.setClearColor(0x0b1118, 1); renderer.render(scene, camera); renderer.setClearColor(0x000000, 0); return 'ok'; };
// show only the meshes whose part name contains `part` (null restores), with an optional override material
window.isolate = (part, mat) => {
  const all = bodyMeshes.concat(...wheelNames.map((n) => wheels[n].meshes));
  for (const o of all) { if (o.userData.isoMat) { o.material = o.userData.isoMat; delete o.userData.isoMat; } o.visible = !part || (o.userData.part || '').includes(part); if (part && o.visible && mat) { o.userData.isoMat = o.material; o.material = mat; } }

};

await applyTime(params.get('time') || 'day');
frame(az, el, dist);
window.preview();
say(`ready — ${bodyMeshes.length} body meshes, ${lamps.length} lamps, hub FR ${hubW.FR.toArray().map((v) => v.toFixed(3))}, ground ${g.toFixed(4)}\nrenderAll({times,wheelTimes,phases,views}) | preview(az,el,dist,spin) | setTime(name,patch) | setPaint(hex) | debug('ao'|'uv'|'clay'|null)`);
if (params.get('auto') === '1') {
  await window.renderAll();
  if (params.get('extras') !== '0') await window.renderExtras();
  await saveJson(`${TAG}_done.json`, { tag: TAG, extras: params.get('extras') !== '0', finished: new Date().toISOString() });
}
